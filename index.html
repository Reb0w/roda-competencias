<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gráfico das Competências</title>
<meta name="description" content="Dê uma nota de 0 a 10 pra cada competência e veja o seu gráfico.">
<meta property="og:title" content="Gráfico das Competências">
<meta property="og:description" content="Aponte a câmera, dê suas notas de 0 a 10 e veja o seu gráfico na hora.">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --ok: #006300;
    --warn-bg: #fdf6e3;
    --warn-bord: #eda100;
    --shadow: 0 1px 2px rgba(11,11,11,0.05), 0 8px 24px -12px rgba(11,11,11,0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --accent: #3987e5;
      --accent-ink: #ffffff;
      --ok: #0ca30c;
      --warn-bg: #2a2410;
      --warn-bord: #c98500;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.6);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100dvh;
    overflow-x: hidden;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 48px; }
  .wrap.largo { max-width: 960px; }

  header.topo { text-align: center; padding: 8px 0 4px; }
  .kicker {
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent);
  }
  h1 { font-size: 26px; line-height: 1.2; letter-spacing: -0.02em; margin-top: 4px; }
  .sub { color: var(--ink2); font-size: 14px; margin-top: 6px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 16px;
    margin-top: 16px;
  }

  .palco { position: relative; padding: 4px 0 0; }
  .palco::before {
    content: ""; position: absolute; inset: -8% 4%; pointer-events: none;
    background: radial-gradient(closest-side at 50% 42%, rgba(42,120,214,0.09), transparent 72%);
  }
  @media (prefers-color-scheme: dark) {
    .palco::before { background: radial-gradient(closest-side at 50% 42%, rgba(57,135,229,0.13), transparent 72%); }
  }
  .palco svg { display: block; width: 100%; height: auto; position: relative; }
  .palco.interativa svg { touch-action: none; cursor: pointer; }

  label.campo { display: block; font-size: 13px; font-weight: 600; color: var(--ink2); margin-bottom: 6px; }
  input[type="text"] {
    width: 100%; padding: 12px 14px; font-size: 16px;
    border: 1px solid var(--baseline); border-radius: 12px;
    background: var(--surface); color: var(--ink); outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 14px 18px; margin-top: 12px;
    border: none; border-radius: 14px; cursor: pointer;
    font: 700 16px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--accent); color: var(--accent-ink);
    box-shadow: var(--shadow);
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
  .btn.fantasma { background: var(--surface); color: var(--ink); border: 1px solid var(--baseline); box-shadow: none; }
  .btn svg { flex: none; }

  .aviso {
    margin-top: 12px; padding: 10px 12px; border-radius: 12px;
    background: var(--warn-bg); border: 1px solid var(--warn-bord);
    font-size: 13px; color: var(--ink2); display: flex; gap: 8px; align-items: flex-start;
  }
  .aviso svg { flex: none; margin-top: 2px; }
  .rodada-barra { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px; margin: 4px 0 14px; font-size: 14px; color: var(--ink2); }
  .rodada-barra b { color: var(--ink); }
  .rodada-barra select { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--baseline); background: var(--surface); color: var(--ink); max-width: 100%; }
  .logo-marca { display: block; height: 60px; width: auto; margin: 0 auto 12px; padding: 8px 16px; background: #ffffff; border-radius: 14px; box-shadow: var(--shadow); }
  .contador .auto { font-size: 12px; color: var(--muted); margin-left: 4px; }
  .baixar-media { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
  .btn.curto { width: auto; margin: 0; padding: 7px 12px; font-size: 13px; }
  .confirma { margin: 0 0 14px; }
  .confirma p { margin: 0 0 10px; font-size: 14px; color: var(--ink2); }
  .confirma .acoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .p-ganhou { font-size: 12px; color: var(--warn-bord); font-weight: 600; margin-left: 6px; }

  .progresso { font-size: 13px; color: var(--muted); text-align: center; margin-top: 10px; font-variant-numeric: tabular-nums; }

  .celebra { text-align: center; padding-top: 8px; }
  .celebra .selo {
    display: inline-flex; align-items: center; gap: 6px;
    background: color-mix(in srgb, var(--ok) 12%, var(--surface));
    color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent);
    font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 999px;
  }

  .rodape { text-align: center; margin-top: 28px; font-size: 12px; color: var(--muted); }
  .rodape a, .rodape button.link {
    color: var(--muted); text-decoration: underline; background: none; border: none;
    font: inherit; cursor: pointer; padding: 0;
  }

  /* ---- modo apresentar ---- */
  .apres-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
  @media (min-width: 760px) { .apres-grid { grid-template-columns: 340px 1fr; align-items: start; } }
  .qr-box { text-align: center; }
  .qr-box .qr-svg { display: inline-block; background: #ffffff; border-radius: 16px; padding: 12px; border: 1px solid var(--border); }
  .qr-box .qr-svg svg { display: block; width: 100%; max-width: 260px; height: auto; }
  .link-copiar {
    display: flex; gap: 8px; margin-top: 12px; align-items: stretch;
  }
  .link-copiar input {
    flex: 1; min-width: 0; font-size: 13px; padding: 10px 12px;
    border: 1px solid var(--baseline); border-radius: 10px;
    background: var(--page); color: var(--ink2);
  }
  .link-copiar .btn { width: auto; margin: 0; padding: 10px 14px; font-size: 14px; }

  .contador { display: flex; align-items: baseline; gap: 8px; justify-content: center; margin-top: 4px; }
  .contador b { font-size: 40px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .contador span { color: var(--ink2); font-size: 14px; }
  .pulso { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    .pulso { animation: pulso 2s ease-in-out infinite; }
    @keyframes pulso { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  }

  .mini-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-top: 12px; }
  .mini { text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 6px 8px; }
  .mini .nome { font-size: 12px; font-weight: 600; color: var(--ink2); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini svg { width: 100%; height: auto; display: block; }

  .secao-titulo { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 20px 0 4px; }
  .vazio { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 8px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(8px);
    background: var(--ink); color: var(--page); font-size: 14px; font-weight: 600;
    padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease; max-width: 90vw; text-align: center;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- sorteio de brindes ---- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chip {
    border: 1px solid var(--baseline); background: var(--surface); color: var(--ink2);
    font: 600 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 10px 14px; border-radius: 999px; cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .lista-participantes { max-height: 42vh; overflow-y: auto; padding: 6px 16px; }
  .participante {
    display: flex; align-items: center; gap: 10px; padding: 11px 0;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .participante:last-child { border-bottom: none; }
  .p-tirar { border: 0; background: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 4px 6px; margin-left: 4px; border-radius: 8px; }
  .p-tirar:hover { color: var(--ink); background: var(--grid); }
  .add-manual { margin-top: 10px; font-size: 13px; color: var(--ink2); }
  .add-manual label { display: block; margin-bottom: 6px; }
  .add-linha { display: flex; gap: 8px; }
  .add-linha input { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--baseline); background: var(--surface); color: var(--ink); }
  .participante input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; margin: 0; }
  .participante .p-nome { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .participante .p-hora { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
  .participante.fora .p-nome { color: var(--muted); text-decoration: line-through; font-weight: 500; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .stepper button {
    width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--baseline);
    background: var(--surface); color: var(--ink); font-size: 22px; font-weight: 700; cursor: pointer;
    line-height: 1;
  }
  .stepper button:disabled { opacity: 0.35; cursor: not-allowed; }
  .stepper b { font-size: 40px; min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
  .roleta {
    text-align: center; padding: 44px 14px 36px; min-height: 220px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  }
  .roleta .nome-grande {
    font-size: clamp(30px, 7vw, 62px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15;
    overflow-wrap: anywhere; max-width: 100%;
  }
  .roleta.girando .nome-grande { color: var(--ink2); }
  .codigo-grande { margin-top: 6px; font-size: 18px; font-weight: 700; letter-spacing: .12em; color: var(--accent); min-height: 1.4em; font-variant-numeric: tabular-nums; }
  .codigo-sorteio { text-align: center; }
  .codigo-sorteio span { display: block; font-size: 13px; color: var(--muted); }
  .codigo-sorteio b { display: block; font-size: 34px; letter-spacing: .16em; margin: 2px 0; color: var(--ink); }
  .codigo-sorteio small { display: block; font-size: 12.5px; color: var(--ink2); }
  .r-cod { font-size: 13px; font-weight: 600; letter-spacing: .1em; color: var(--muted); margin-left: auto; }
  .roleta .festejo { font-size: 40px; line-height: 1; }
  .linha-rank { display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-bottom: 1px solid var(--border); }
  .linha-rank:last-child { border-bottom: none; }
  .linha-rank .medalha { font-size: 26px; width: 44px; text-align: center; flex: none; }
  .linha-rank .medalha.num { font-size: 17px; font-weight: 700; color: var(--muted); }
  .linha-rank .r-nome { font-size: clamp(18px, 3.5vw, 26px); font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
  .confete { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .confete i {
    position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px;
    animation: confete-cai linear forwards;
  }
  @keyframes confete-cai {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(115vh) rotate(720deg); opacity: 0.9; }
  }
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="toast" class="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<script>
(function () {
  'use strict';

  /* ---------- configuração ---------- */
  var SUPA_URL = 'https://tqtkjmdkmtqgjcchonax.supabase.co';
  var SUPA_KEY = 'sb_publishable_Mpop5d-vbhpWpEFcqOmqSg_uzQCFvoI';
  var TABELA = 'roda_respostas';

  var COMPETENCIAS_PADRAO = [
    'Comunicação', 'Trabalho em equipe', 'Liderança', 'Organização',
    'Criatividade', 'Resolução de problemas', 'Inteligência emocional', 'Aprendizado contínuo'
  ];

  var params = new URLSearchParams(location.search);
  var COMPETENCIAS = COMPETENCIAS_PADRAO;
  if (params.get('c')) {
    var custom = params.get('c').split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    if (custom.length >= 3 && custom.length <= 12) COMPETENCIAS = custom.map(function (s) { return s.slice(0, 40); });
  }
  var N = COMPETENCIAS.length;
  var SESSAO = (params.get('s') || 'geral').slice(0, 60);
  /* o painel conta as respostas a partir deste momento ("Zerar e começar agora");
     sem marco, conta desde o começo do dia. O link e o QR nunca mudam. */
  var LS_MARCO = 'roda:marco:' + SESSAO;
  var MODO_APRESENTAR = params.get('modo') === 'apresentar';

  /* paleta categórica validada (ordem fixa, claro/escuro) */
  var SLOTS_CLARO = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#4a3aa7', '#e34948'];
  var SLOTS_ESCURO = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];
  var TEMA_CLARO = { slots: SLOTS_CLARO, surface: '#fcfcfb', ink: '#0b0b0b', ink2: '#52514e', muted: '#898781', grid: '#e1e0d9', baseline: '#c3c2b7' };
  var TEMA_ESCURO = { slots: SLOTS_ESCURO, surface: '#1a1a19', ink: '#ffffff', ink2: '#c3c2b7', muted: '#898781', grid: '#2c2c2a', baseline: '#383835', escuro: true };
  var mqEscuro = window.matchMedia('(prefers-color-scheme: dark)');
  function temaAtual() { return mqEscuro.matches ? TEMA_ESCURO : TEMA_CLARO; }
  function corSlot(i, tema) { return tema.slots[i % tema.slots.length]; }

  /* ---------- estado ---------- */
  var LS_CHAVE = 'roda:' + SESSAO;
  var salvo = null;
  try { salvo = JSON.parse(localStorage.getItem(LS_CHAVE) || 'null'); } catch (e) { salvo = null; }
  if (salvo && (!Array.isArray(salvo.valores) || salvo.valores.length !== N)) salvo = null;
  /* enviou em outro dia (outra apresentação): começa um gráfico novo, só o nome fica */
  if (salvo && salvo.enviado && (!salvo.enviadoEm || diaLocalIso(salvo.enviadoEm) !== diaLocalIso(Date.now()))) {
    salvo = { nome: salvo.nome || '', valores: new Array(N).fill(null), enviado: false, sincronizado: false };
  }

  var uid = null;
  try {
    uid = localStorage.getItem('roda:uid');
    if (!uid) { uid = 'u' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); localStorage.setItem('roda:uid', uid); }
  } catch (e) { uid = 'u' + Math.random().toString(36).slice(2, 10); }

  /* código do sorteio: 4 letras e números tirados do aparelho (quem não põe o
     nome, ou põe um apelido, mostra o código se ganhar) */
  var ALFA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function codigoDe(id) {
    var h = 2166136261;
    for (var i = 0; i < id.length; i++) { h ^= id.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    var c = '';
    for (var k = 0; k < 4; k++) { c += ALFA[h % 32]; h = Math.floor(h / 32); }
    return c;
  }
  var CODIGO = codigoDe(uid);
  function codigoDaPessoa(p) {
    var n = p && p.notas;
    if (n && typeof n.codigo === 'string') return n.codigo;
    return n && n.uid ? codigoDe(String(n.uid)) : '';
  }

  var estado = {
    nome: salvo ? salvo.nome : '',
    valores: salvo ? salvo.valores.slice() : new Array(N).fill(null),
    enviado: !!(salvo && salvo.enviado),
    sincronizado: !!(salvo && salvo.sincronizado),
    enviadoEm: (salvo && salvo.enviadoEm) || null,
    editando: false
  };

  function nomeVisivel() {
    var n = String(estado.nome || '').trim().slice(0, 40);
    return n.length >= 2 ? n : 'Participante ' + CODIGO;
  }

  function persistir() {
    try {
      localStorage.setItem(LS_CHAVE, JSON.stringify({
        nome: estado.nome, valores: estado.valores, enviado: estado.enviado, sincronizado: estado.sincronizado,
        enviadoEm: estado.enviado ? (estado.enviadoEm || new Date().toISOString()) : null
      }));
    } catch (e) { /* storage indisponível: segue em memória */ }
  }

  /* ---------- desenho da roda (SVG string, cores literais pro export) ---------- */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function polar(cx, cy, r, ang) {
    return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
  }
  function setorPath(cx, cy, r, a0, a1) {
    var p0 = polar(cx, cy, r, a0), p1 = polar(cx, cy, r, a1);
    var grande = (a1 - a0) > Math.PI ? 1 : 0;
    return 'M' + cx + ',' + cy + ' L' + p0[0].toFixed(2) + ',' + p0[1].toFixed(2) +
      ' A' + r + ',' + r + ' 0 ' + grande + ' 1 ' + p1[0].toFixed(2) + ',' + p1[1].toFixed(2) + ' Z';
  }
  function quebraRotulo(nome) {
    if (nome.length <= 11) return [nome];
    var palavras = nome.split(' ');
    if (palavras.length === 1) return [nome];
    var l1 = '', l2 = '';
    for (var i = 0; i < palavras.length; i++) {
      if ((l1 + ' ' + palavras[i]).trim().length <= 12 && !l2) l1 = (l1 + ' ' + palavras[i]).trim();
      else l2 = (l2 + ' ' + palavras[i]).trim();
    }
    return l2 ? [l1, l2] : [l1];
  }

  /**
   * opts: { valores, tema, rotulos (bool), numeros (bool), titulo, subtitulo, fundo (bool) }
   */
  function svgRoda(opts) {
    var tema = opts.tema || temaAtual();
    var valores = opts.valores;
    var comLabels = !!opts.rotulos;
    var margem = comLabels ? 100 : 10;
    var extraTopo = opts.titulo ? 64 : 0;
    var R = 150, cx = R + margem, cy = R + margem + extraTopo;
    var W = 2 * (R + margem), H = 2 * (R + margem) + extraTopo + (opts.subtitulo ? 8 : 0);
    var pad = (Math.PI / 180) * (N > 8 ? 1.0 : 1.4);
    var passo = 2 * Math.PI / N;
    var out = [];

    out.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gráfico das competências">');
    if (opts.fundo) out.push('<rect width="' + W + '" height="' + H + '" fill="' + tema.surface + '"/>');

    if (opts.titulo) {
      out.push('<text x="' + (W / 2) + '" y="30" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="19" font-weight="700" fill="' + tema.ink + '">' + esc(opts.titulo) + '</text>');
      if (opts.subtitulo) out.push('<text x="' + (W / 2) + '" y="52" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="' + tema.ink2 + '">' + esc(opts.subtitulo) + '</text>');
    }

    /* trilhas (fundo de cada setor) */
    var i, a0, a1, mid;
    for (i = 0; i < N; i++) {
      a0 = -Math.PI / 2 + i * passo + pad; a1 = -Math.PI / 2 + (i + 1) * passo - pad;
      out.push('<path d="' + setorPath(cx, cy, R, a0, a1) + '" fill="' + tema.grid + '" fill-opacity="' + (tema.escuro ? 0.8 : 0.45) + '"/>');
    }
    /* anéis de referência 2..10 */
    for (i = 1; i <= 5; i++) {
      out.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + (R * i / 5) + '" fill="none" stroke="' + tema.surface + '" stroke-width="1.5"/>');
    }
    /* preenchimento por valor */
    for (i = 0; i < N; i++) {
      var v = valores[i];
      if (v === null || v === undefined) continue;
      a0 = -Math.PI / 2 + i * passo + pad; a1 = -Math.PI / 2 + (i + 1) * passo - pad;
      if (v > 0) {
        var rV = Math.max(R * v / 10, 8);
        out.push('<path d="' + setorPath(cx, cy, rV, a0, a1) + '" fill="' + corSlot(i, tema) + '"/>');
      }
    }
    /* miolo */
    out.push('<circle cx="' + cx + '" cy="' + cy + '" r="7" fill="' + tema.surface + '" stroke="' + tema.baseline + '" stroke-width="1.5"/>');

    /* números */
    if (opts.numeros) {
      for (i = 0; i < N; i++) {
        var v2 = valores[i];
        if (v2 === null || v2 === undefined) continue;
        mid = -Math.PI / 2 + (i + 0.5) * passo;
        var rFill = R * v2 / 10;
        var dentro = rFill >= 44; /* preenchimento fundo o bastante pro número caber dentro */
        var rNum = dentro ? rFill - 15 : Math.max(rFill + 15, 24);
        var pn = polar(cx, cy, rNum, mid);
        var estilo = dentro
          ? 'fill="#ffffff" stroke="rgba(11,11,11,0.4)" stroke-width="2.5" paint-order="stroke" stroke-linejoin="round"'
          : 'fill="' + tema.ink + '"';
        out.push('<text x="' + pn[0].toFixed(1) + '" y="' + (pn[1] + 5).toFixed(1) + '" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" ' + estilo + '>' + (Math.round(v2 * 10) / 10) + '</text>');
      }
    }

    /* rótulos das competências */
    if (comLabels) {
      for (i = 0; i < N; i++) {
        mid = -Math.PI / 2 + (i + 0.5) * passo;
        var c = Math.cos(mid), s = Math.sin(mid);
        var pl = polar(cx, cy, R + 20, mid);
        var anchor = Math.abs(c) < 0.34 ? 'middle' : (c > 0 ? 'start' : 'end');
        var linhas = quebraRotulo(COMPETENCIAS[i]);
        var dy0 = s < -0.34 ? (linhas.length > 1 ? -14 : -2) : (s > 0.34 ? 8 : (linhas.length > 1 ? -6 : 2));
        out.push('<text x="' + pl[0].toFixed(1) + '" y="' + (pl[1] + dy0).toFixed(1) + '" text-anchor="' + anchor + '" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="' + tema.ink2 + '">');
        for (var j = 0; j < linhas.length; j++) {
          out.push('<tspan x="' + pl[0].toFixed(1) + '" dy="' + (j === 0 ? 0 : 14) + '">' + esc(linhas[j]) + '</tspan>');
        }
        out.push('</text>');
      }
    }
    out.push('</svg>');
    return out.join('');
  }

  /* ---------- rede (Supabase REST) ---------- */
  var cabecalhos = {
    'apikey': SUPA_KEY,
    'Authorization': 'Bearer ' + SUPA_KEY,
    'Content-Type': 'application/json'
  };
  var servidorOk = null; /* null = desconhecido, true/false após 1ª chamada */

  function enviarResposta() {
    var corpo = JSON.stringify({
      sessao: SESSAO,
      nome: nomeVisivel(),
      notas: { uid: uid, codigo: CODIGO, competencias: COMPETENCIAS, valores: estado.valores }
    });
    return fetch(SUPA_URL + '/rest/v1/' + TABELA, {
      method: 'POST', headers: cabecalhos, body: corpo
    }).then(function (r) {
      servidorOk = r.ok;
      return r.ok;
    }).catch(function () { servidorOk = false; return false; });
  }

  function buscarRespostas() {
    /* desc + reverse: se passar de 400 linhas, o corte joga fora as antigas, nunca as de hoje */
    var q = SUPA_URL + '/rest/v1/' + TABELA +
      '?sessao=eq.' + encodeURIComponent(SESSAO) +
      '&criado_em=gte.' + encodeURIComponent(lerMarco()) +
      '&select=nome,notas,criado_em&order=criado_em.desc&limit=400';
    return fetch(q, { headers: cabecalhos }).then(function (r) {
      servidorOk = r.ok;
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (linhas) { return linhas.reverse(); });
  }

  /* última resposta por pessoa (uid; fallback nome) */
  function deduplicar(linhas) {
    var porChave = {};
    for (var i = 0; i < linhas.length; i++) {
      var l = linhas[i];
      if (!l.notas || !Array.isArray(l.notas.valores)) continue;
      var chave = l.notas.uid || ('nome:' + String(l.nome).trim().toLowerCase());
      porChave[chave] = l; /* ordem asc: a última sobrescreve */
    }
    var out = [];
    for (var k in porChave) out.push(porChave[k]);
    out.sort(function (a, b) { return a.criado_em < b.criado_em ? -1 : 1; });
    return out;
  }

  /* ---------- export PNG ---------- */
  /* o SVG só tem viewBox: sem width e height o navegador desenha em 300x150 e a imagem saía cortada */
  function svgComTamanho(svgString) {
    var m = /viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(svgString);
    var w = m ? Math.round(+m[1]) : 600, hh = m ? Math.round(+m[2]) : 600;
    return { svg: /<svg [^>]*\swidth=/.test(svgString) ? svgString : svgString.replace('<svg ', '<svg width="' + w + '" height="' + hh + '" '), w: w, h: hh };
  }

  function baixarPng(svgString, arquivo, escala) {
    var t = svgComTamanho(svgString);
    var blob = new Blob([t.svg], { type: 'image/svg+xml;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function () {
      var canvas = document.createElement('canvas');
      canvas.width = t.w * escala;
      canvas.height = t.h * escala;
      var ctx = canvas.getContext('2d');
      ctx.scale(escala, escala);
      ctx.drawImage(img, 0, 0, t.w, t.h);
      URL.revokeObjectURL(url);
      canvas.toBlob(function (png) {
        if (!png) { toast('Não deu pra gerar a imagem'); return; }
        var a = document.createElement('a');
        a.href = URL.createObjectURL(png);
        a.download = arquivo;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      }, 'image/png');
    };
    img.onerror = function () { URL.revokeObjectURL(url); toast('Não deu pra gerar a imagem'); };
    img.src = url;
  }

  function compartilharPng(svgString, arquivo, texto) {
    var t = svgComTamanho(svgString);
    var blob = new Blob([t.svg], { type: 'image/svg+xml;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var img = new Image();
    img.onload = function () {
      var canvas = document.createElement('canvas');
      canvas.width = t.w * 2;
      canvas.height = t.h * 2;
      var ctx = canvas.getContext('2d');
      ctx.scale(2, 2);
      ctx.drawImage(img, 0, 0, t.w, t.h);
      URL.revokeObjectURL(url);
      canvas.toBlob(function (png) {
        if (!png) { toast('Não deu pra gerar a imagem'); return; }
        var file = new File([png], arquivo, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], text: texto }).catch(function () { /* usuário cancelou */ });
        } else {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(png);
          a.download = arquivo;
          document.body.appendChild(a);
          a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
          toast('Imagem baixada, é só anexar');
        }
      }, 'image/png');
    };
    img.onerror = function () { URL.revokeObjectURL(url); toast('Não deu pra gerar a imagem'); };
    img.src = url;
  }

    /* toque/arrasto direto na roda: setor = competência, distância do centro = nota */
    var palco = document.getElementById('palco');
    var arrastando = false;
    function notaDoToque(ev) {
      var svg = palco.querySelector('svg');
      if (!svg) return null;
      var box = svg.getBoundingClientRect();
      if (!box.width || !box.height) return null;
      var x = (ev.clientX - box.left) * (500 / box.width);
      var y = (ev.clientY - box.top) * (500 / box.height);
      var dx = x - 250, dy = y - 250;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 162) return null; /* fora da roda (rótulos ficam clicáveis sem efeito) */
      var ang = Math.atan2(dy, dx) + Math.PI / 2;
      if (ang < 0) ang += 2 * Math.PI;
      var i = Math.min(N - 1, Math.floor(ang / (2 * Math.PI / N)));
      return { i: i, v: Math.min(10, Math.round(dist / 150 * 10)) };
    }
    palco.addEventListener('pointerdown', function (e) {
      var r = notaDoToque(e);
      if (!r) return;
      arrastando = true;
      try { palco.setPointerCapture(e.pointerId); } catch (err) { /* navegador sem captura */ }
      e.preventDefault();
      aplicarValor(r.i, r.v);
    });
    palco.addEventListener('pointermove', function (e) {
      if (!arrastando) return;
      var r = notaDoToque(e);
      if (r && estado.valores[r.i] !== r.v) aplicarValor(r.i, r.v);
    });
    ['pointerup', 'pointercancel'].forEach(function (t) {
      palco.addEventListener(t, function () { arrastando = false; });
    });

    function atualizarEnviar() {
      var c = estado.valores.filter(function (x) { return x !== null; }).length;

        estado.sincronizado = ok;
        estado.editando = false;
        persistir();
        renderPronto();
      });
    });

    document.getElementById('ir-apresentar').addEventListener('click', irApresentar);
  }

        function () { try { document.execCommand('copy'); toast('Link copiado'); } catch (e) { toast('Copie manualmente'); } }
      );
    });

    document.getElementById('baixar-qr').addEventListener('click', function () {
      try {
        var qr2 = qrcode(0, 'M');
        qr2.addData(link);
        qr2.make();
        var n = qr2.getModuleCount();
        var cs = 16, mg = 4 * cs, tam = n * cs + 2 * mg;
        var canvas = document.createElement('canvas');
        canvas.width = tam; canvas.height = tam + 90;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0b0b0b';
        for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (qr2.isDark(r, c)) ctx.fillRect(mg + c * cs, mg + r * cs, cs, cs);
        ctx.font = '700 34px system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Gráfico das Competências', tam / 2, tam + 30);
        ctx.font = '400 24px system-ui, sans-serif'; ctx.fillStyle = '#52514e';
        ctx.fillText('Aponte a câmera e dê suas notas', tam / 2, tam + 66);
        canvas.toBlob(function (png) {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(png);
          a.download = 'qr-roda-das-competencias.png';
          document.body.appendChild(a);
          a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
        }, 'image/png');
      } catch (e) { toast('Não deu pra gerar o QR'); }
    });

    document.getElementById('atualizar').addEventListener('click', function () { carregarPainel(true); });
    document.getElementById('abrir-sorteio').addEventListener('click', abrirSorteio);
    ligarBarraRodada();

    carregarPainel(false);
    clearInterval(pollTimer);
    pollTimer = setInterval(function () {
      if (!document.hidden) carregarPainel(false);
    }, 5000);
  }

  function barraRodada() {
    return '<div class="rodada-barra"><span>Contando as respostas desde <b>' + esc(rotuloMarco()) + '</b></span>' +
      '<button class="btn fantasma curto" id="nova-rodada">Zerar e começar agora</button>' +
      (marcoEhInicioDoDia() ? '' : '<button class="btn fantasma curto" id="ver-dia">Ver todas de hoje</button>') + '</div>' +
      '<div class="card confirma" id="confirma-rodada" hidden>' +
      '<p>O painel volta pro zero e só conta quem enviar a partir de agora. Quem já respondeu sai do painel e do sorteio, mas as respostas continuam guardadas. O QR e o link continuam os mesmos.</p>' +
      '<div class="acoes"><button class="btn curto" id="confirma-sim">Zerar agora</button>' +
      '<button class="btn fantasma curto" id="confirma-nao">Cancelar</button></div></div>';
  }
  function ligarBarraRodada() {
    var caixa = document.getElementById('confirma-rodada');
    document.getElementById('nova-rodada').addEventListener('click', function () { caixa.hidden = false; });
    document.getElementById('confirma-nao').addEventListener('click', function () { caixa.hidden = true; });
    document.getElementById('confirma-sim').addEventListener('click', function () {
      definirMarco(new Date().toISOString());
      sorteio = null;
      renderApresentar();
      toast('Painel zerado. Pode mostrar o QR');
    });
    var dia = document.getElementById('ver-dia');
    if (dia) dia.addEventListener('click', function () { definirMarco(null); sorteio = null; renderApresentar(); });
  }

  function carregarPainel(manual) {
    buscarRespostas().then(function (linhas) {
      if (!document.getElementById('qtd')) return; /* saiu do painel antes da resposta chegar */
      var pessoas = deduplicar(linhas);
      pintarPainel(pessoas);
      if (manual) toast('Painel atualizado');
    }).catch(function () {
      if (!document.getElementById('qtd')) return;
      document.getElementById('qtd').textContent = '–';
      document.getElementById('pulso').style.background = 'var(--warn-bord)';
      document.getElementById('abrir-sorteio').disabled = true;
      document.getElementById('estado-servidor').innerHTML =
        '<div class="aviso">' + ICONES.alerta + '<span>O painel não está conseguindo buscar as respostas agora. Confira a internet e toque em Atualizar.</span></div>';
    });
  }

  function pintarPainel(pessoas) {
    document.getElementById('qtd').textContent = pessoas.length;
    document.getElementById('qtd-rotulo').textContent = pessoas.length === 1 ? 'resposta' : 'respostas';
    document.getElementById('pulso').style.background = 'var(--ok)';
    document.getElementById('abrir-sorteio').disabled = !pessoas.length;
    document.getElementById('estado-servidor').innerHTML = '';

    var mediaBloco = document.getElementById('media-bloco');
    var minis = document.getElementById('minis');
    var tituloInd = document.getElementById('titulo-individuais');

    if (!pessoas.length) {
      mediaBloco.innerHTML = '<div class="card"><p class="vazio">Ninguém enviou ainda. Assim que a primeira pessoa enviar, a média da turma aparece aqui, ao vivo.</p></div>';
      minis.innerHTML = '';
      tituloInd.hidden = true;
      return;
    }

    var soma = new Array(N).fill(0), qtd = new Array(N).fill(0);
    pessoas.forEach(function (p) {
      for (var i = 0; i < N; i++) {
        var v = p.notas.valores[i];
        if (typeof v === 'number') { soma[i] += v; qtd[i]++; }
      }
    });
    var media = soma.map(function (s, i) { return qtd[i] ? Math.round((s / qtd[i]) * 10) / 10 : null; });

    mediaBloco.innerHTML =
      '<div class="secao-titulo">Média da turma</div>' +
      '<div class="card palco">' + svgRoda({ valores: media, rotulos: true, numeros: true }) + '</div>' +
      '<div class="baixar-media">' +
      '<button class="btn fantasma curto" data-baixar="imagem">' + ICONES.baixar + 'Baixar imagem da média</button>' +
      '<button class="btn fantasma curto" data-baixar="planilha">' + ICONES.baixar + 'Baixar planilha com as notas</button>' +
      '</div>';
    ultimoPainel = { pessoas: pessoas, media: media };

    tituloInd.hidden = false;
    minis.innerHTML = pessoas.map(function (p) {
      return '<div class="mini">' + svgRoda({ valores: p.notas.valores, rotulos: false, numeros: false }) +
        '<div class="nome" title="' + esc(p.nome) + '">' + esc(p.nome) + '</div></div>';
    }).join('');
  }

  /* ---------- baixar a média da turma (imagem) e as notas (planilha) ---------- */
  var ultimoPainel = null;
  function dataHoje() { var d = new Date(); return pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1) + '/' + d.getFullYear(); }
  function sufixoArquivo() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function baixarImagemMedia() {
    if (!ultimoPainel) return;
    var n = ultimoPainel.pessoas.length;
    baixarPng(svgRoda({
      valores: ultimoPainel.media, tema: TEMA_CLARO, rotulos: true, numeros: true, fundo: true,
      titulo: 'Média da turma', subtitulo: dataHoje() + ' · ' + n + (n === 1 ? ' pessoa' : ' pessoas')
    }), 'media-da-turma-' + sufixoArquivo() + '.png', 2);
    toast('Imagem da média baixada');
  }
  function celulaCsv(v) {
    var t = v === null || v === undefined ? '' : String(v);
    return /[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }
  function numeroBr(v) { return typeof v === 'number' ? String(v).replace('.', ',') : ''; }
  function baixarPlanilha() {
    if (!ultimoPainel) return;
    var linhas = [['Nome', 'Código', 'Hora'].concat(COMPETENCIAS)];
    ultimoPainel.pessoas.forEach(function (p) {
      linhas.push([p.nome, codigoDaPessoa(p), horaLocal(p.criado_em)].concat(p.notas.valores.map(numeroBr)));
    });
    linhas.push([]);
    linhas.push(['Média da turma', '', ''].concat(ultimoPainel.media.map(numeroBr)));
    /* ponto e vírgula e BOM: o Excel em português abre com as colunas e os acentos certos */
    var csv = '\ufeff' + linhas.map(function (l) { return l.map(celulaCsv).join(';'); }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'notas-grafico-das-competencias-' + sufixoArquivo() + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast('Planilha baixada');
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-baixar]') : null;
    if (!b) return;
    if (b.getAttribute('data-baixar') === 'imagem') baixarImagemMedia();
    else baixarPlanilha();
  });

  /* ---------- sorteio de brindes ---------- */
  var sorteio = null;

  function pad2(n) { return String(n).padStart(2, '0'); }
  function diaLocalIso(t) { var d = new Date(t); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function rotuloDia(iso) { return iso.slice(8, 10) + '/' + iso.slice(5, 7); }
  function horaLocal(t) { var d = new Date(t); return pad2(d.getHours()) + 'h' + pad2(d.getMinutes()); }
  function aleatorio(n) {
    var b = new Uint32Array(1);
    crypto.getRandomValues(b);
    return b[0] % n;
  }
  function chavePessoa(p) { return (p.notas && p.notas.uid) || 'nome:' + String(p.nome).trim().toLowerCase(); }
  function movimentoReduzido() { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

  function abrirSorteio() {
    clearInterval(pollTimer);
    buscarRespostas().then(function (linhas) {
      var validas = linhas.filter(function (l) { return l.notas && Array.isArray(l.notas.valores); });
      var dias = {};
      validas.forEach(function (l) { dias[diaLocalIso(l.criado_em)] = true; });
      var listaDias = [];
      var hoje = diaLocalIso(Date.now());
      sorteio = {
        linhas: validas,
        dias: listaDias,
        /* sem resposta hoje: cai no dia mais recente, nunca mistura dinamicas por padrao */
        escopo: 'todas',
        /* quem já ganhou um brinde nesta rodada começa fora (dá pra marcar de novo) */
        excluidos: (function () { var g = lerGanhadores(), o = {}; for (var k in g) o[k] = true; return o; })(),
        ganhadores: lerGanhadores(),
        qtd: 3,
        vencedores: []
      };
      renderSorteioSetup();
    }).catch(function () {
      toast('Não deu pra buscar as respostas. Tente de novo');
      sorteio = null;
      renderApresentar();
    });
  }

  function participantesEscopo() {
    var linhas = sorteio.linhas;
    if (sorteio.escopo !== 'todas') {
      linhas = linhas.filter(function (l) { return diaLocalIso(l.criado_em) === sorteio.escopo; });
    }
    return deduplicar(linhas).concat(lerExtras().map(function (x) {
      return { nome: x.nome, notas: { uid: x.id, codigo: '' }, criado_em: x.em, manual: true };
    }));
  }
  /* quem esqueceu o celular: o apresentador põe o nome à mão (só neste aparelho, desde o marco) */
  function chaveExtras() { return 'roda:extras:' + SESSAO + ':' + lerMarco(); }
  function lerExtras() {
    try { var l = JSON.parse(localStorage.getItem(chaveExtras()) || 'null'); return Array.isArray(l) ? l : (extrasNaMemoria || []); } catch (e) { return extrasNaMemoria || []; }
  }
  function gravarExtras(l) {
    try { localStorage.setItem(chaveExtras(), JSON.stringify(l)); } catch (e) { /* sem storage: vale só até recarregar */ }
    extrasNaMemoria = l;
  }
  var extrasNaMemoria = null;
  function poolSorteio() {
    return participantesEscopo().filter(function (p) { return !sorteio.excluidos[chavePessoa(p)]; });
  }
  function contarDia(diaIso) {
    var linhas = diaIso === 'todas' ? sorteio.linhas :
      sorteio.linhas.filter(function (l) { return diaLocalIso(l.criado_em) === diaIso; });
    return deduplicar(linhas).length;
  }
  function escopoLabel() {
    return 'Respostas desde ' + rotuloMarco();
  }

  function renderSorteioSetup() {
    var pessoas = participantesEscopo();
    var pool = poolSorteio();
    if (sorteio.qtd > pool.length) sorteio.qtd = Math.max(1, pool.length);
    var hoje = diaLocalIso(Date.now());

    var chips = '';
    if (sorteio.dias.length > 1) {
      sorteio.dias.forEach(function (d) {
        chips += '<button class="chip' + (sorteio.escopo === d ? ' on' : '') + '" data-dia="' + d + '">' +
          (d === hoje ? 'Hoje' : rotuloDia(d)) + ' · ' + contarDia(d) + '</button>';
      });
      chips += '<button class="chip' + (sorteio.escopo === 'todas' ? ' on' : '') + '" data-dia="todas">Todos os dias · ' + contarDia('todas') + '</button>';
    }

    var itens = pessoas.map(function (p, i) {
      var fora = !!sorteio.excluidos[chavePessoa(p)];
      return '<label class="participante' + (fora ? ' fora' : '') + '">' +
        '<input type="checkbox" data-i="' + i + '"' + (fora ? '' : ' checked') + '>' +
        '<span class="p-nome">' + esc(p.nome) + (sorteio.ganhadores && sorteio.ganhadores[chavePessoa(p)] ? '<span class="p-ganhou">já ganhou</span>' : '') + '</span>' +
        (p.manual
          ? '<span class="p-hora">sem celular</span><button type="button" class="p-tirar" data-tirar="' + esc(p.notas.uid) + '" aria-label="Tirar ' + esc(p.nome) + ' da lista">✕</button>'
          : '<span class="p-hora">' + esc(codigoDaPessoa(p)) + ' · ' + horaLocal(p.criado_em) + '</span>') +
        '</label>';
    }).join('');

    app.className = 'wrap';
    app.innerHTML =
      '<header class="topo">' + LOGO +
      '<div class="kicker">Modo apresentador</div>' +
      '<h1>Sorteio de brindes</h1>' +
      '<p class="sub">Concorre quem enviou o gráfico. Desmarque quem já foi embora.</p>' +
      '</header>' +
      (chips ? '<div class="secao-titulo">Respostas de quando?</div><div class="chips">' + chips + '</div>' : '') +
      '<div class="secao-titulo" style="display:flex;align-items:center;gap:8px">' +
      '<span>Participantes · <span id="qtd-pool">' + pool.length + '</span> no sorteio</span>' +
      '<button class="btn fantasma" id="atualizar-lista" style="width:auto;margin:0 0 0 auto;padding:6px 10px;font-size:12px">' + ICONES.atualizar + 'Atualizar</button>' +
      '</div>' +
      '<div class="card lista-participantes" id="lista-part">' +
      (itens || '<p class="vazio">Ninguém enviou ainda.</p>') +
      '</div>' +
      '<form class="add-manual" id="form-extra">' +
      '<label for="nome-extra">Alguém está sem celular? Põe o nome aqui:</label>' +
      '<div class="add-linha"><input type="text" id="nome-extra" maxlength="40" placeholder="Nome da pessoa" autocomplete="off">' +
      '<button type="submit" class="btn fantasma curto">Adicionar</button></div>' +
      '</form>' +
      '<div class="secao-titulo">Quantos brindes?</div>' +
      '<div class="card stepper">' +
      '<button id="menos" aria-label="Menos um brinde"' + (sorteio.qtd <= 1 ? ' disabled' : '') + '>−</button>' +
      '<b id="qtd-brindes">' + sorteio.qtd + '</b>' +
      '<button id="mais" aria-label="Mais um brinde"' + (sorteio.qtd >= pool.length ? ' disabled' : '') + '>+</button>' +
      '</div>' +
      '<button class="btn" id="comecar"' + (pool.length ? '' : ' disabled') + '>' + ICONES.presente + 'Sortear agora</button>' +
      '<div class="rodape"><button class="link" id="voltar-painel">Voltar ao painel</button></div>';

    Array.prototype.forEach.call(app.querySelectorAll('.chip'), function (ch) {
      ch.addEventListener('click', function () {
        sorteio.escopo = ch.getAttribute('data-dia');
        renderSorteioSetup();
      });
    });

    document.getElementById('atualizar-lista').addEventListener('click', function () {
      buscarRespostas().then(function (linhas) {
        var validas = linhas.filter(function (l) { return l.notas && Array.isArray(l.notas.valores); });
        var dias = {};
        validas.forEach(function (l) { dias[diaLocalIso(l.criado_em)] = true; });
        sorteio.linhas = validas;
        sorteio.dias = [];
        if (sorteio.escopo !== 'todas' && !dias[sorteio.escopo]) sorteio.escopo = sorteio.dias[0] || 'todas';
        renderSorteioSetup();
        toast('Lista atualizada');
      }).catch(function () { toast('Não deu pra atualizar. Tente de novo'); });
    });

    var lista = document.getElementById('lista-part');
    lista.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-tirar]') : null;
      if (!t) return;
      e.preventDefault();
      var id = t.getAttribute('data-tirar');
      gravarExtras(lerExtras().filter(function (x) { return x.id !== id; }));
      delete sorteio.excluidos[id];
      renderSorteioSetup();
    });
    document.getElementById('form-extra').addEventListener('submit', function (e) {
      e.preventDefault();
      var campo = document.getElementById('nome-extra');
      var nome = campo.value.trim().slice(0, 40);
      if (nome.length < 2) { toast('Escreva o nome da pessoa'); campo.focus(); return; }
      var l = lerExtras();
      l.push({ id: 'manual:' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), nome: nome, em: new Date().toISOString() });
      gravarExtras(l);
      renderSorteioSetup();
      toast(nome + ' entrou no sorteio');
      var lp = document.getElementById('lista-part');
      if (lp) lp.scrollTop = lp.scrollHeight;
    });
    lista.addEventListener('change', function (e) {
      var cb = e.target;
      if (cb.tagName !== 'INPUT') return;
      var p = pessoas[Number(cb.getAttribute('data-i'))];
      if (!p) return;
      if (cb.checked) delete sorteio.excluidos[chavePessoa(p)];
      else sorteio.excluidos[chavePessoa(p)] = true;
      var rolagem = lista.scrollTop;
      renderSorteioSetup();
      document.getElementById('lista-part').scrollTop = rolagem;
    });

    document.getElementById('menos').addEventListener('click', function () {
      sorteio.qtd = Math.max(1, sorteio.qtd - 1);
      renderSorteioSetup();
    });
    document.getElementById('mais').addEventListener('click', function () {
      sorteio.qtd = Math.min(poolSorteio().length, sorteio.qtd + 1);
      renderSorteioSetup();
    });
    document.getElementById('comecar').addEventListener('click', function () {
      sorteio.vencedores = [];
      renderSorteioRodada();
    });
    document.getElementById('voltar-painel').addEventListener('click', function () {
      sorteio = null;
      renderApresentar();
    });
  }

  function renderSorteioRodada() {
    var n = sorteio.vencedores.length + 1;
    var pool = poolSorteio().filter(function (p) {
      return !sorteio.vencedores.some(function (v) { return chavePessoa(v) === chavePessoa(p); });
    });
    if (!pool.length) { renderSorteioFinal(); return; }
    var vencedor = pool[aleatorio(pool.length)];

    app.className = 'wrap';
    app.innerHTML =
      '<header class="topo">' + LOGO +
      '<div class="kicker">' + n + 'º brinde' + (sorteio.qtd > 1 ? ' de ' + sorteio.qtd : '') + '</div>' +
      '<h1>E o brinde vai pra...</h1>' +
      '</header>' +
      '<div class="card roleta girando" id="roleta">' +
      '<div class="festejo" id="festejo" hidden>🎉</div>' +
      '<div class="nome-grande" id="nome-roleta">...</div>' +
      '<div class="codigo-grande" id="codigo-roleta"></div>' +
      '</div>' +
      '<div id="pos-sorteio" hidden>' +
      '<button class="btn" id="proximo"></button>' +
      '<button class="btn fantasma" id="refazer">Não está aqui? Sortear este de novo</button>' +
      '</div>';

    var el = document.getElementById('nome-roleta');
    var atraso = 60;
    var ultimo = -1;

    function girar() {
      if (!document.getElementById('nome-roleta')) return; /* saiu da tela no meio do giro */
      var i;
      do { i = aleatorio(pool.length); } while (pool.length > 1 && i === ultimo);
      ultimo = i;
      el.textContent = pool[i].nome;
      atraso *= 1.14;
      if (atraso < 380) setTimeout(girar, atraso);
      else setTimeout(revelar, atraso);
    }
    function revelar() {
      if (!document.getElementById('nome-roleta')) return;
      document.getElementById('roleta').classList.remove('girando');
      el.textContent = vencedor.nome;
      var cod = codigoDaPessoa(vencedor);
      document.getElementById('codigo-roleta').textContent = cod ? 'Código ' + cod : '';
      document.getElementById('festejo').hidden = false;
      confete();
      sorteio.vencedores.push(vencedor);
      var falta = sorteio.vencedores.length < sorteio.qtd;
      var btn = document.getElementById('proximo');
      btn.innerHTML = falta ? ICONES.presente + 'Sortear o próximo brinde' : ICONES.check + 'Ver o resultado';
      btn.addEventListener('click', function () {
        if (sorteio.vencedores.length < sorteio.qtd) renderSorteioRodada();
        else renderSorteioFinal();
      });
      document.getElementById('refazer').addEventListener('click', function () {
        sorteio.excluidos[chavePessoa(vencedor)] = true;
        sorteio.vencedores.pop();
        renderSorteioRodada();
      });
      document.getElementById('pos-sorteio').hidden = false;
    }

    if (movimentoReduzido() || pool.length === 1) setTimeout(revelar, 500);
    else girar();
  }

  function renderSorteioFinal() {
    guardarGanhadores(sorteio.vencedores);
    var medalhas = ['🥇', '🥈', '🥉'];
    var linhas = sorteio.vencedores.map(function (v, i) {
      var medalha = medalhas[i]
        ? '<span class="medalha">' + medalhas[i] + '</span>'
        : '<span class="medalha num">' + (i + 1) + 'º</span>';
      return '<div class="linha-rank">' + medalha + '<span class="r-nome">' + esc(v.nome) + '</span><span class="r-cod">' + esc(codigoDaPessoa(v)) + '</span></div>';
    }).join('');

    app.className = 'wrap';
    app.innerHTML =
      '<header class="topo celebra">' + LOGO +
      '<span class="selo">' + ICONES.check + 'Sorteio concluído</span>' +
      '<h1 style="margin-top:10px">Ganhadores</h1>' +
      '<p class="sub">' + escopoLabel() + ' · ' + sorteio.vencedores.length +
      (sorteio.vencedores.length === 1 ? ' brinde sorteado' : ' brindes sorteados') + '</p>' +
      '</header>' +
      '<div class="card">' + (linhas || '<p class="vazio">Ninguém foi sorteado.</p>') + '</div>' +
      (sorteio.vencedores.length ? '<button class="btn" id="baixar-resultado">' + ICONES.baixar + 'Baixar resultado</button>' : '') +
      '<button class="btn fantasma" id="denovo">Sortear tudo de novo</button>' +
      '<div class="rodape"><button class="link" id="voltar-painel">Voltar ao painel</button></div>';

    var baixar = document.getElementById('baixar-resultado');
    if (baixar) baixar.addEventListener('click', baixarResultadoSorteio);
    document.getElementById('denovo').addEventListener('click', function () {
      /* "tudo de novo": os ganhadores deste sorteio voltam a concorrer */
      var g = lerGanhadores();
      sorteio.vencedores.forEach(function (v) { delete g[chavePessoa(v)]; delete sorteio.excluidos[chavePessoa(v)]; delete sorteio.ganhadores[chavePessoa(v)]; });
      try { localStorage.setItem(chaveGanhadores(), JSON.stringify(g)); } catch (e) { /* sem storage */ }
      sorteio.vencedores = [];
      renderSorteioSetup();
    });
    document.getElementById('voltar-painel').addEventListener('click', function () {
      sorteio = null;
      renderApresentar();
    });
  }

  function baixarResultadoSorteio() {
    var medalhas = ['🥇', '🥈', '🥉'];
    var hoje = new Date();
    var data = pad2(hoje.getDate()) + '/' + pad2(hoje.getMonth() + 1) + '/' + hoje.getFullYear();
    var linhaAltura = 64, topo = 150;
    var L = 900, A = topo + sorteio.vencedores.length * linhaAltura + 40;
    var canvas = document.createElement('canvas');
    canvas.width = L * 2; canvas.height = A * 2;
    var ctx = canvas.getContext('2d');
    ctx.scale(2, 2);
    ctx.fillStyle = '#fcfcfb'; ctx.fillRect(0, 0, L, A);
    ctx.fillStyle = '#0b0b0b';
    ctx.font = '800 34px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Sorteio de brindes', L / 2, 56);
    ctx.font = '400 18px system-ui, sans-serif'; ctx.fillStyle = '#52514e';
    ctx.fillText('Gráfico das Competências · ' + escopoLabel() + ' · ' + data, L / 2, 88);
    ctx.textAlign = 'left';
    sorteio.vencedores.forEach(function (v, i) {
      var y = topo + i * linhaAltura;
      ctx.font = '400 30px system-ui, sans-serif'; ctx.fillStyle = '#0b0b0b';
      ctx.fillText(medalhas[i] || (i + 1) + 'º', 60, y);
      ctx.font = '700 30px system-ui, sans-serif';
      ctx.fillText(String(v.nome).slice(0, 40) + (codigoDaPessoa(v) ? '  ·  ' + codigoDaPessoa(v) : ''), 130, y);
    });
    canvas.toBlob(function (png) {
      if (!png) { toast('Não deu pra gerar a imagem'); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(png);
      a.download = 'sorteio-roda-das-competencias.png';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      toast('Resultado salvo nos downloads');
    }, 'image/png');
  }

  function confete() {
    if (movimentoReduzido()) return;
    var caixa = document.createElement('div');
    caixa.className = 'confete';
    var cores = temaAtual().slots;
    var html = '';
    for (var i = 0; i < 60; i++) {
      html += '<i style="left:' + (Math.random() * 100).toFixed(1) + 'vw;background:' + cores[i % cores.length] +
        ';animation-duration:' + (1.6 + Math.random() * 1.4).toFixed(2) + 's;animation-delay:' + (Math.random() * 0.3).toFixed(2) + 's"></i>';
    }
    caixa.innerHTML = html;
    document.body.appendChild(caixa);
    setTimeout(function () { caixa.remove(); }, 3600);
  }

  /* ---------- boot ---------- */
  mqEscuro.addEventListener('change', function () {
    if (sorteio) return; /* telas do sorteio usam só tokens de CSS, sem re-render */
    if (MODO_APRESENTAR) renderApresentar();
    else if (estado.enviado && !estado.editando) renderPronto();
    else renderPreencher();
  });

  if (MODO_APRESENTAR) renderApresentar();
  else if (estado.enviado && !estado.editando) renderPronto();
  else renderPreencher();
})();
</script>
